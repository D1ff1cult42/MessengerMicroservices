server:
  port: 8086

spring:
  application:
    name: realtime-gateway

springwolf:
  docket:
    info:
      title: Realtime Gateway WebSocket API
      version: 1.0.0
      description: WebSocket API gateway для получения сообщений, статусов доставки и typing индикаторов
    servers:
      stomp-server:
        protocol: stomp
        host: localhost:8086/ws