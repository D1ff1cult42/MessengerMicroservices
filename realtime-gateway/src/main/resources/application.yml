server:
  port: 8086

spring:
  application:
    name: realtime-gateway
  datasource:
    url: ${REALTIME_DATASOURCE_URL:jdbc:postgresql://localhost:5432/realtime_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8071}
      specific.avro.reader: true
      use.latest.version: false
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicNameStrategy
    consumer:
      group-id: realtime-gateway-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 300000
        max.poll.records: 10
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        batch.size: 16384
        compression.type: lz4
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual
      concurrency: 3
grpc:
  chat-client:
    enabled: true
  client:
    chat-service:
      address: static://${CHAT_SERVICE_GRPC_HOST:chat-service}:${CHAT_SERVICE_GRPC_PORT:9092}
      negotiation-type: plaintext

springwolf:
  docket:
    info:
      title: Realtime Gateway WebSocket API
      version: 1.0.0
      description: WebSocket API gateway для получения сообщений, статусов доставки и typing индикаторов
    servers:
      stomp-server:
        protocol: stomp
        host: localhost:8086/ws