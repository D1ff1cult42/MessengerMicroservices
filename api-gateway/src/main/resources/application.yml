server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

            - id: message-service
              uri: http://message-service:8082
              predicates:
                - Path=/api/messages/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: messageCircuitBreaker
                    fallbackUri: forward:/fallback/message-service

            - id: file-service
              uri: http://file-service:8083
              predicates:
                - Path=/api/files/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: fileCircuitBreaker
                    fallbackUri: forward:/fallback/file-service

            - id: chat-service
              uri: http://chat-service:8084
              predicates:
                - Path=/api/chats/**,/api/chat-participants/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: chatCircuitBreaker
                    fallbackUri: forward:/fallback/chat-service

jwt:
  public-key: ${JWT_PUBLIC_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

resilience4j:
  circuitbreaker:
    instances:
      authCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      messageCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      fileCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      chatCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      authCircuitBreaker:
        timeoutDuration: 3s
      messageCircuitBreaker:
        timeoutDuration: 5s
      fileCircuitBreaker:
        timeoutDuration: 10s
      chatCircuitBreaker:
        timeoutDuration: 5s
