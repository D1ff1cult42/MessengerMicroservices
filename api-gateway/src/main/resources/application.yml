server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

            - id: message-service
              uri: http://message-service:8082
              predicates:
                - Path=/api/messages/**,/api/message-status/**,/api/message-statuses/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: messageCircuitBreaker
                    fallbackUri: forward:/fallback/message-service

            - id: file-service
              uri: http://file-service:8083
              predicates:
                - Path=/api/files/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: fileCircuitBreaker
                    fallbackUri: forward:/fallback/file-service

            - id: chat-service
              uri: http://chat-service:8084
              predicates:
                - Path=/api/chats/**,/api/chat-participants/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: chatCircuitBreaker
                    fallbackUri: forward:/fallback/chat-service

            - id: account-service
              uri: http://account-service:8085
              predicates:
                - Path=/api/my_account/**,/api/accounts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accountCircuitBreaker
                    fallbackUri: forward:/fallback/account-service

            - id: fulltext-search-service
              uri: http://fulltext-search-service:8087
              predicates:
                - Path=/api/search/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: searchCircuitBreaker
                    fallbackUri: forward:/fallback/fulltext-search-service

            - id: realtime-gateway-ws
              uri: ws://realtime-gateway:8086
              predicates:
                - Path=/ws/**
            - id: realtime-gateway
              uri: http://realtime-gateway:8086
              predicates:
                - Path=/springwolf/**

            - id: mail-service
              uri: http://mail-service:8088
              predicates:
                - Path=/api/mail/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: mailCircuitBreaker
                    fallbackUri: forward:/fallback/mail-service

            - id: auth-service-docs
              uri: http://auth-service:8081
              predicates:
                - Path=/docs/auth/**
              filters:
                - StripPrefix=2

            - id: message-service-docs
              uri: http://message-service:8082
              predicates:
                - Path=/docs/message/**
              filters:
                - StripPrefix=2

            - id: chat-service-docs
              uri: http://chat-service:8084
              predicates:
                - Path=/docs/chat/**
              filters:
                - StripPrefix=2

            - id: account-service-docs
              uri: http://account-service:8085
              predicates:
                - Path=/docs/account/**
              filters:
                - StripPrefix=2

            - id: realtime-gateway-docs
              uri: http://realtime-gateway:8086
              predicates:
                - Path=/docs/realtime/**
              filters:
                - StripPrefix=2

            - id: fulltext-search-service-docs
              uri: http://fulltext-search-service:8087
              predicates:
                - Path=/docs/search/**
              filters:
                - StripPrefix=2

            - id: mail-service-docs
              uri: http://mail-service:8088
              predicates:
                - Path=/docs/mail/**
              filters:
                - StripPrefix=2

jwt:
  public-key: ${JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    urls:
      - name: auth-service
        url: /docs/auth/v3/api-docs
      - name: message-service
        url: /docs/message/v3/api-docs
      - name: chat-service
        url: /docs/chat/v3/api-docs
      - name: account-service
        url: /docs/account/v3/api-docs
      - name: fulltext-search-service
        url: /docs/search/v3/api-docs
      - name: mail-service
        url: /docs/mail/v3/api-docs
    urls-primary-name: auth-service

management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: api-gateway
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.data.repository.invocations: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics, circuitbreakers
logging:
  level:
    io.opentelemetry: WARN
  pattern:
    console: ""

resilience4j:
  circuitbreaker:
    instances:
      authCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      messageCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      fileCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      chatCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      accountCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      searchCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      mailCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true


  timelimiter:
    instances:
      authCircuitBreaker:
        timeoutDuration: 3s
      messageCircuitBreaker:
        timeoutDuration: 5s
      fileCircuitBreaker:
        timeoutDuration: 10s
      chatCircuitBreaker:
        timeoutDuration: 5s
      accountCircuitBreaker:
        timeoutDuration: 5s
      searchCircuitBreaker:
        timeoutDuration: 5s
      mailCircuitBreaker:
        timeoutDuration: 5s
