server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/auth-service

            - id: message-service
              uri: http://message-service:8082
              predicates:
                - Path=/api/messages/**,/api/message-status/**,/api/message-statuses/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: messageCircuitBreaker
                    fallbackUri: forward:/fallback/message-service

            - id: file-service
              uri: http://file-service:8083
              predicates:
                - Path=/api/files/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: fileCircuitBreaker
                    fallbackUri: forward:/fallback/file-service

            - id: chat-service
              uri: http://chat-service:8084
              predicates:
                - Path=/api/chats/**,/api/chat-participants/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: chatCircuitBreaker
                    fallbackUri: forward:/fallback/chat-service

            - id: account-service
              uri: http://account-service:8085
              predicates:
                - Path=/api/my_account/**,/api/accounts/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: accountCircuitBreaker
                    fallbackUri: forward:/fallback/account-service

            - id: realtime-gateway
              uri: http://realtime-gateway:8086
              predicates:
                - Path=/ws/**,/springwolf/**

jwt:
  public-key: ${JWT_PUBLIC_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers

resilience4j:
  circuitbreaker:
    instances:
      authCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      messageCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      fileCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      chatCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      accountCircuitBreaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true


  timelimiter:
    instances:
      authCircuitBreaker:
        timeoutDuration: 3s
      messageCircuitBreaker:
        timeoutDuration: 5s
      fileCircuitBreaker:
        timeoutDuration: 10s
      chatCircuitBreaker:
        timeoutDuration: 5s
      accountCircuitBreaker:
        timeoutDuration: 5s
