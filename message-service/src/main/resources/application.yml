minio:
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  endpoint: ${MINIO_ENDPOINT}
  bucket-expirations:
    video: 1h
    image: 3h
    audio: 5h
    document: 6h
  file-max-size-bytes: 104857600 # 100 MB

supported-file-types:
  video:
    - avi
    - mov
  image:
    - jpeg
    - jpg
    - png
    - gif
  audio:
    - mp3
    - wav
  document:
    - pdf
    - docx
    - doc
    - xlsx
    - txt

spring:
  application:
    name: message-service
  datasource:
    url: ${MESSAGE_DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health