grpc:
  file-client:
    enabled: true
  chat-client:
    enabled: true
  client:
    file-service:
      address: static://${FILE_SERVICE_GRPC_HOST:file-service}:${FILE_SERVICE_GRPC_PORT:9091}
      negotiation-type: plaintext
    chat-service:
      address: static://${CHAT_SERVICE_GRPC_HOST:chat-service}:${CHAT_SERVICE_GRPC_PORT:9092}
      negotiation-type: plaintext

bucket-resolver:
  enabled: true
  buckets:
    message-image:
      extensions: jpg, jpeg, png, gif, bmp, webp, svg
    message-video:
      extensions: mp4, avi, mov, mkv, webm
    message-audio:
      extensions: mp3, wav, ogg, flac, aac
    message-document:
      extensions: pdf, doc, docx, xls, xlsx, ppt, pptx, txt, csv, zip, rar

spring:
  application:
    name: message-service
  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB
  datasource:
    url: ${MESSAGE_DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8071}
      specific.avro.reader: true
      use.latest.version: false
      value.subject.name.strategy: io.confluent.kafka.serializers.subject.TopicNameStrategy
    consumer:
      group-id: message-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 300000
        max.poll.records: 10
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 10
        batch.size: 16384
        compression.type: lz4
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
    listener:
      ack-mode: manual
      concurrency: 3


management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
server:
  port: 8082