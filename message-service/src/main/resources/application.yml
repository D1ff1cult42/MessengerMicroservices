grpc:
  file-client:
    enabled: true
  client:
    file-service:
      address: static://${FILE_SERVICE_GRPC_HOST:file-service}:${FILE_SERVICE_GRPC_PORT:9091}
      negotiation-type: plaintext
    chat-service:
      address: static://${CHAT_SERVICE_GRPC_HOST:chat-service}:${CHAT_SERVICE_GRPC_PORT:9092}
      negotiation-type: plaintext

bucket-resolver:
  buckets:
    message-image:
      extensions: jpg, jpeg, png, gif, bmp, webp, svg
    message-video:
      extensions: mp4, avi, mov, mkv, webm
    message-audio:
      extensions: mp3, wav, ogg, flac, aac
    message-document:
      extensions: pdf, doc, docx, xls, xlsx, ppt, pptx, txt, csv, zip, rar

spring:
  application:
    name: message-service
  servlet:
    multipart:
      max-file-size: 400MB
      max-request-size: 400MB
  datasource:
    url: ${MESSAGE_DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
server:
  port: 8082