grpc:
  file-client:
    enabled: true
  account-client:
    enabled: true
  server:
    port: 9092
  client:
    file-service:
      address: static://${FILE_SERVICE_GRPC_HOST:file-service}:${FILE_SERVICE_GRPC_PORT:9091}
      negotiation-type: plaintext
    account-service:
      address: static://${ACCOUNT_SERVICE_GRPC_HOST:account-service}:${ACCOUNT_SERVICE_GRPC_PORT:9092}
      negotiation-type: plaintext

bucket-resolver:
  enabled: true
  buckets:
    chat-icon:
      extensions: jpg, jpeg, png, gif, bmp, webp, svg

spring:
  application:
    name: chat-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${CHAT_DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true

management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: chat-service
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.request: true
        spring.data.repository.invocations: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
logging:
  level:
    io.opentelemetry: WARN
  pattern:
    console: ""

server:
  port: 8084