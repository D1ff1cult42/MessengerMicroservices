global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: messenger
    environment: local

scrape_configs:
  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:8081']
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
  - job_name: message-service
    static_configs:
      - targets: [ 'message-service:8082' ]
    metrics_path: /actuator/prometheus
    scrape_interval: 10s