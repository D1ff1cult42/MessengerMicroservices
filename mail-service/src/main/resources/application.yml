server:
  port: 8088

spring:
  application:
    name: mail-service
  datasource:
    url: ${MAIL_DATASOURCE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0
    validate-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mail:
  token:
    expiration: ${MAIL_TOKEN_EXPIRATION:24h}
    deletionReminderTime: ${DELETION_REMINDER_TIME:6h}
    scheduled-check-interval: ${SCHEDULED_CHECK_INTERVAL:3600000}
  confirm-url: ${MAIL_CONFIRM_URL:http://localhost:8080/api/mail/confirm}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health