<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:40px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <tr>
                    <td style="background-color:#4A90D9; padding:30px; text-align:center;">
                        <h1 style="color:#ffffff; margin:0; font-size:24px;">Messenger</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:40px 30px;">
                        <h2 style="color:#333333; margin:0 0 20px;">Подтверждение аккаунта</h2>
                        <p style="color:#666666; font-size:16px; line-height:1.5;">
                            Спасибо за регистрацию! Нажмите кнопку ниже, чтобы подтвердить ваш email:
                        </p>
                        <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding:30px 0;">
                                    <a th:href="${confirmUrl}"
                                       style="background-color:#4A90D9; color:#ffffff; padding:14px 40px;
                                                  text-decoration:none; border-radius:6px; font-size:16px;
                                                  font-weight:bold; display:inline-block;">
                                        Подтвердить аккаунт
                                    </a>
                                </td>
                            </tr>
                        </table>
                        <p style="color:#999999; font-size:14px;">
                            Ссылка действительна <span th:text="${expirationHours}">24</span> часов.
                        </p>
                        <p style="color:#999999; font-size:13px;">
                            Если вы не регистрировались — просто проигнорируйте это письмо.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f9f9f9; padding:20px 30px; text-align:center; border-top:1px solid #eeeeee;">
                        <p style="color:#999999; font-size:12px; margin:0;">
                            © 2026 Messenger. Все права защищены.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
