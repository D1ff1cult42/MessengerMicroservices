plugins {
    id 'java-library'
    id "com.google.protobuf" version "0.9.4"
    id "com.github.davidmc24.gradle.plugin.avro" version "1.9.1"
}

group = 'com.d1ff'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://packages.confluent.io/maven/" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.2')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.data:spring-data-commons:3.2.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-web'
    api('net.devh:grpc-client-spring-boot-starter:3.1.0.RELEASE') {
        exclude group: 'io.grpc', module: 'grpc-netty-shaded'
    }
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    implementation 'org.slf4j:slf4j-api:2.0.16'

    api platform('io.grpc:grpc-bom:1.63.0')
    api 'io.grpc:grpc-netty'
    api 'io.grpc:grpc-api'
    api 'io.grpc:grpc-stub'
    api 'io.grpc:grpc-protobuf'
    api 'com.google.protobuf:protobuf-java:3.25.3'

    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    api 'org.apache.avro:avro:1.12.0'
}

avro {
    stringType = "String"
    fieldVisibility = "PRIVATE"
    outputCharacterEncoding = "UTF-8"
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.63.0'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

test {
    useJUnitPlatform()
}