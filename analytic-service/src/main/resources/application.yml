server:
  port: 8090

events:
  auth-events:
    - LOGIN
    - LOGOUT
    - LOGOUT_ALL
    - REFRESH_TOKEN
    - REGISTER
  message-events:
    - MESSAGE_SENT
    - MESSAGE_UPDATED
    - MESSAGE_DELETED
    - MESSAGE_DELETED_BY_ADMIN

spring:
  application:
    name: analytic-service

  datasource:
    url: jdbc:ch://${CLICKHOUSE_HOST:localhost}:8123/${CLICKHOUSE_DB:analytics}
    driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
      specific.avro.reader: true
    consumer:
      group-id: analytic-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 50
    listener:
      ack-mode: manual


management:
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: analytic-service
      environment: ${ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.request: true
        spring.data.repository.invocations: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://tempo:4318/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
logging:
  level:
    io.opentelemetry: WARN
  pattern:
    console: ""

geoip:
  database-path: ${GEOIP_DB_PATH:/etc/geoip/GeoLite2-Country.mmdb}