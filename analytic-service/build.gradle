plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.d1ff'
version = '0.0.1-SNAPSHOT'
description = 'analytic-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url "https://packages.confluent.io/maven/" }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework:spring-web'
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.2')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.data:spring-data-commons:3.2.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    implementation("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-web'

    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation('io.confluent:kafka-avro-serializer:7.7.1') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    implementation 'com.maxmind.geoip2:geoip2:4.2.0'
    implementation 'com.clickhouse:clickhouse-jdbc:0.6.3'
    implementation 'com.clickhouse:clickhouse-http-client:0.6.3'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'

    implementation project(':common')
}

tasks.named('test') {
    enabled = false
    useJUnitPlatform()
}
